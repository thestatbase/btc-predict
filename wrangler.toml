name = "btc-predict"
main = "worker.js"
compatibility_date = "2026-08-03"
workers_dev = true

# Cloudflare's cron service invokes the auditor independently of browser visits.
[triggers]
crons = ["* * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "btc-predict"
database_id = "2d2b3168-049c-4fa5-a4bf-c23338f530c0"
